version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
    exclude:
      - "brakeman"
  groups:
    bundler-dependencies:
      patterns:
        - "*"
      exclude-patterns:
        - "brakeman"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns:
        - "*"
