name: Deploy

# CIがmainで成功したあとに、イメージをビルドして学科サーバーVMへ反映する。
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # branches はヘッドブランチ名でしか絞れず、フォークのmainも一致してしまう。
    # フォーク由来のコミットがビルド・デプロイされないよう、イベントとリポジトリも確認する。
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: build
    # needs だけに頼らず、self-hostedランナーで動くジョブ自身にも同じ条件を付ける。
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # VM上のself-hosted runner。VMから外向きに接続するだけでよい。
    runs-on: self-hosted
    permissions: {}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # runnerのユーザー(grc-runner)はdocker/sudoグループに入れていない。
      # sudoersで許可しているのは grc-deploy だけで、pull・migrate・up・
      # ヘルスチェックはVM側のスクリプトが行う。
      # compose定義もVM側(/opt/grc/compose.prod.yml)に固定しており、
      # 変更したときは管理者が手で更新する。
      - name: 反映
        run: sudo -n /usr/local/bin/grc-deploy "$DEPLOY_SHA"
