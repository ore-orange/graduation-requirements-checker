services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # bin/dev で rails server と Tailwind のウォッチを並行起動する
    command: bin/dev
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      RAILS_ENV: development
    volumes:
      # ソースをマウントしてホストの編集を即反映
      - .:/app
      # gem と一時ファイルはコンテナ側を使う（ホストと混ざると壊れる）
      - bundle_data:/usr/local/bundle
      - tmp_data:/app/tmp
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

volumes:
  postgres_data:
  bundle_data:
  tmp_data:
