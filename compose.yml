services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      TZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # foreman(bin/dev) は tailwindcss が内部で spawn する sh を誤って
    # 「管理下プロセスの終了」と解釈し、web ごと停止させてしまう。
    # そのため Docker では foreman を使わず、css を別サービスに分離している。
    command: bin/rails server -b 0.0.0.0 -p 3000
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      RAILS_ENV: development
    volumes:
      # ソースをマウントしてホストの編集を即反映
      - .:/app
      # gem と一時ファイルはコンテナ側を使う（ホストと混ざると壊れる）
      - bundle_data:/usr/local/bundle
      - tmp_data:/app/tmp
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

  css:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # [always] を付けないと stdin が閉じた時点で watch が終了してしまう
    command: bin/rails tailwindcss:watch[always]
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      RAILS_ENV: development
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
      - tmp_data:/app/tmp
    # watch が落ちても Docker が勝手に立ち上げ直す（web は巻き込まれない）
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  bundle_data:
  tmp_data:
