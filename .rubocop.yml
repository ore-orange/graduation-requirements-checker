# チーム共通の Ruby / Rails スタイル設定
plugins:
  - rubocop-rails
  - rubocop-rake
  - rubocop-performance

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/*"
    - "config/**/*"
    - "db/**/*"
    - "node_modules/**/*"
    - "vendor/**/*"

# クラス名と実装で意図が伝わるようにするため、必須コメントは課さない
Style/Documentation:
  Enabled: false

# コメントは日本語で書く
Style/AsciiComments:
  Enabled: false

# 既定値は厳しすぎるため緩和する
Metrics/AbcSize:
  Max: 30

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "test/**/*"

Metrics/ParameterLists:
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Max: 200
  Exclude:
    - "test/**/*"
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']

# テストは記述量が増えがちなので対象外にする
Metrics/BlockLength:
  Exclude:
    - "test/**/*"

# end は対応する if の位置に合わせる
Layout/EndAlignment:
  EnforcedStyleAlignWith: keyword

# 文字列展開が不要ならシングルクオートを使う
Style/StringLiterals:
  EnforcedStyle: single_quotes

# ガード節の直後は空行を入れて区切る
Layout/EmptyLineAfterGuardClause:
  Enabled: true

# ファイル末尾は必ず改行で終える
Layout/TrailingEmptyLines:
  EnforcedStyle: final_blank_line

# シンボルの配列は %i[] で書く
Style/SymbolArray:
  Enabled: true
  EnforcedStyle: percent

# 文字列の配列は %w[] で書く
Style/WordArray:
  Enabled: true
  EnforcedStyle: percent

# ロケールに直接文字列を置く書き方を許容する
Rails/I18nLocaleTexts:
  Enabled: false

# ラムダは -> 記法に統一する
Style/Lambda:
  EnforcedStyle: literal
