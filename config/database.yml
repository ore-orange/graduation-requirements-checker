# PostgreSQL接続。秘密情報は環境変数のみから取得する。
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  host: <%= ENV.fetch('DATABASE_HOST', 'localhost').inspect %>
  port: <%= ENV.fetch('DATABASE_PORT', 5432) %>
  username: <%= ENV.fetch('DATABASE_USER', 'postgres').inspect %>
  password: <%= ENV.fetch('DATABASE_PASSWORD', 'password').inspect %>

development:
  <<: *default
  url: <%= ENV['DEVELOPMENT_DATABASE_URL']&.inspect %>
  database: grc_development

test:
  <<: *default
  url: <%= ENV['TEST_DATABASE_URL']&.inspect %>
  database: grc_test

# 本番の4論理DB構成は維持する。同一Supabase DBへの集約は承認後に行う。
# DATABASE_URLはRailsにより優先され、接続方式の差はURLで指定できる。
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV['DATABASE_URL']&.inspect %>
    database: app_production
    username: app
    password: <%= ENV['APP_DATABASE_PASSWORD']&.inspect %>
    sslmode: <%= ENV.fetch('DATABASE_SSLMODE', 'require').inspect %>
    sslrootcert: <%= ENV['DATABASE_SSLROOTCERT']&.inspect %>
  cache:
    <<: *primary_production
    url: <%= ENV['CACHE_DATABASE_URL']&.inspect %>
    database: app_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    url: <%= ENV['QUEUE_DATABASE_URL']&.inspect %>
    database: app_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    url: <%= ENV['CABLE_DATABASE_URL']&.inspect %>
    database: app_production_cable
    migrations_paths: db/cable_migrate
